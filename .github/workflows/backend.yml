name: Backend CI/CD

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

jobs:
  build-scan-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "17"
          cache: maven

      - name: Build and Test
        working-directory: backend
        run: mvn -B clean verify

      - name: SonarQube Analysis
        working-directory: backend
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B sonar:sonar \
            -Dsonar.projectKey=datastore \
            -Dsonar.projectName=datastore \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.token="$SONAR_TOKEN"

      - name: Find JAR
        id: jar
        working-directory: backend
        run: |
          JAR=$(find target -maxdepth 1 -type f \
            -name '*.jar' ! -name '*-sources.jar' \
            ! -name '*-javadoc.jar' \
            ! -name 'original-*.jar' | head -n 1)

          test -n "$JAR" || {
            echo "No application JAR found"
            exit 1
          }

          echo "path=backend/$JAR" >> "$GITHUB_OUTPUT"

      - name: Upload JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: ${{ steps.jar.outputs.path }}
          target: /home/ec2-user/deploy/
          strip_components: 2

      - name: Deploy Application
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            set -e

            sudo mkdir -p /opt/datastore
            sudo chown ec2-user:ec2-user /opt/datastore

            JAR=$(find /home/ec2-user/deploy \
              -maxdepth 1 -name '*.jar' -type f | head -n 1)

            test -n "$JAR"

            sudo systemctl stop datastore || true
            sudo cp "$JAR" /opt/datastore/datastore.jar
            sudo chown ec2-user:ec2-user /opt/datastore/datastore.jar

            sudo tee /etc/systemd/system/datastore.service > /dev/null <<'EOF'
            [Unit]
            Description=Datastore Spring Boot Application
            After=network.target

            [Service]
            User=ec2-user
            WorkingDirectory=/opt/datastore
            ExecStart=/usr/bin/java -jar /opt/datastore/datastore.jar --server.port=8084
            Restart=on-failure
            RestartSec=5

            [Install]
            WantedBy=multi-user.target
            EOF

            sudo systemctl daemon-reload
            sudo systemctl enable datastore
            sudo systemctl restart datastore
            sudo systemctl is-active --quiet datastore

      - name: Verify Deployment
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            for i in {1..12}; do
              if curl -fsS http://localhost:8084/actuator/health; then
                exit 0
              fi
              sleep 5
            done

            sudo journalctl -u datastore -n 80 --no-pager
            exit 1
